name: Phoop
options:
  bundleIdPrefix: com.phoop
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Phoop:
    type: application
    platform: iOS
    sources:
      - path: Phoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoop.app
        CODE_SIGN_ENTITLEMENTS: Phoop/Phoop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Phoop/Info.plist
      properties:
        CFBundleDisplayName: Phoop
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.phoop.app.sync]
        NSBluetoothAlwaysUsageDescription: Phoop se conecta a tu pulsera para leer tu pulso, sueño y actividad.
        NSHealthShareUsageDescription: Phoop puede leer datos de Apple Salud para completar tus métricas.
        NSHealthUpdateUsageDescription: Phoop guarda en Apple Salud el pulso, HRV, oxígeno, temperatura, pasos y sueño de tu pulsera.
        UIAppFonts:
          - SairaCondensed-Bold.ttf
          - SairaCondensed-SemiBold.ttf
          - SairaCondensed-Medium.ttf
